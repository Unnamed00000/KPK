<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f7a55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KPK">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>KPK DØRE OG VINDUER</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="KPK Døre og Vinduer">
        <div class="brand-lockup">
          <p class="eyebrow" data-i18n="workSheet">Arbejdsseddel</p>
          <img class="brand-logo" src="assets/kpk-logo.svg" alt="KPK Døre og Vinduer">
        </div>
        <div class="topbar-actions">
          <label class="language-control">
            <span data-i18n="language">Sprog</span>
            <select id="languageSelect">
              <option value="da">Dansk</option>
              <option value="en">English</option>
              <option value="ar">العربية</option>
              <option value="ru">Русский</option>
            </select>
          </label>
        </div>
      </section>

      <section class="calendar-panel" id="calendarView" aria-label="Kalender">
        <div class="section-head">
          <div>
            <h2 data-i18n="calendar">Kalender</h2>
            <p class="calendar-hint" data-i18n="calendarHint">Vælg en dato for at udfylde arbejdssedlen.</p>
          </div>
          <div class="calendar-nav">
            <button class="icon-button" id="prevMonthButton" type="button" title="Forrige måned" data-i18n-title="previousMonth">‹</button>
            <strong id="calendarTitle"></strong>
            <button class="icon-button" id="nextMonthButton" type="button" title="Næste måned" data-i18n-title="nextMonth">›</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <div class="editor-view" id="editorView" hidden>
      <section class="editor-toolbar">
        <button class="text-button muted" id="backToCalendarButton" type="button" data-i18n="backToCalendar">Kalender</button>
        <strong id="selectedDateLabel"></strong>
      </section>

      <section class="worker-panel" aria-label="Grundoplysninger">
        <label class="full-name-field">
          <span data-i18n="fullName">Navn og efternavn</span>
          <input id="firstName" autocomplete="name" placeholder="Navn og efternavn" data-i18n-placeholder="fullNamePlaceholder">
        </label>
        <label>
          <span data-i18n="employeeNumber">Medarbejdernummer</span>
          <input id="employeeNumber" inputmode="numeric" placeholder="Medarbejdernummer" data-i18n-placeholder="employeeNumberPlaceholder">
        </label>
        <label>
          <span data-i18n="week">Uge</span>
          <input id="weekNumber" type="number" min="1" max="53">
        </label>
        <label>
          <span data-i18n="day">Dag</span>
          <select id="dayNumber">
            <option value="1">1 - Mandag</option>
            <option value="2">2 - Tirsdag</option>
            <option value="3">3 - Onsdag</option>
            <option value="4">4 - Torsdag</option>
            <option value="5">5 - Fredag</option>
          </select>
        </label>
        <input id="defaultPlace" type="hidden" value="440">
      </section>

      <section class="table-section" aria-label="Arbejde for dagen">
        <div class="section-head">
          <h2 data-i18n="seriesAndTime">Serier og tid</h2>
          <div class="row-actions">
            <button class="text-button muted" id="meetingButton" type="button" data-i18n="addMeeting">+ Møde 114</button>
            <button class="text-button" id="addRowButton" type="button" data-i18n="addSeries">+ Serie</button>
          </div>
        </div>

        <div class="work-table" role="table" aria-label="Arbejdsliste">
          <div class="work-row header" role="row">
            <span data-i18n="place">Plads</span>
            <span data-i18n="series">Serie</span>
            <span data-i18n="from">Fra</span>
            <span data-i18n="to">Til</span>
            <span data-i18n="time">Tid</span>
            <span></span>
            <span></span>
          </div>
          <div id="rows"></div>
        </div>
      </section>

      <section class="summary-strip" aria-label="Dagens totaler">
        <article>
          <span data-i18n="shift">Arbejdstid</span>
          <strong id="shiftWindow">06:00-15:05</strong>
        </article>
        <article class="summary-total">
          <span data-i18n="counted">I alt</span>
          <strong id="totalTime">0,00</strong>
        </article>
      </section>

      <section class="print-sheet" aria-label="Tekst til sedlen">
        <div class="section-head">
          <h2 data-i18n="readyText">Tekst til sedlen</h2>
          <div class="print-actions">
            <span id="copyStatus" role="status"></span>
            <button class="icon-button" id="printButton" type="button" title="Print" data-i18n-title="print">⎙</button>
            <button class="text-button" id="copyButton" type="button" data-i18n="copy">Kopier</button>
          </div>
        </div>
        <pre id="sheetPreview"></pre>
      </section>
      </div>

      <footer class="app-footer">
        <span data-i18n="createdBy">Created by Adam Margoev</span>
      </footer>
    </main>

    <template id="rowTemplate">
      <div class="work-row" role="row">
        <label>
          <span data-i18n="place">Plads</span>
          <input class="place-input" inputmode="numeric" placeholder="440">
        </label>
        <label>
          <span data-i18n="series">Serie</span>
          <input class="series-input" placeholder="Serienummer" data-i18n-placeholder="seriesPlaceholder">
        </label>
        <label>
          <span data-i18n="from">Fra</span>
          <input class="start-input" type="time" step="300">
        </label>
        <label>
          <span data-i18n="to">Til</span>
          <input class="end-input" type="time" step="300">
        </label>
        <output class="duration-output">0,00</output>
        <div class="move-controls" aria-label="Flyt række" data-i18n-aria-label="moveRow">
          <button class="move-button move-up" type="button" title="Op" data-i18n-title="moveUp">↑</button>
          <button class="move-button move-down" type="button" title="Ned" data-i18n-title="moveDown">↓</button>
        </div>
        <button class="remove-button" type="button" title="Slet række" data-i18n-title="deleteRow">×</button>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
